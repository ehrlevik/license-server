<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Licencji - Boty AFK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #2c3e50; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .card { background: #2d3748; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; font-weight: bold; 
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #34495e; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #4a5568; }
        th { background: #2c5282; }
        .status-active { color: #68d391; font-weight: bold; }
        .status-inactive { color: #fc8181; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #a0aec0; }
        input, select { width: 100%; padding: 10px; background: #4a5568; border: 1px solid #718096; border-radius: 5px; color: white; }
        .license-key { font-family: monospace; background: #1a202c; padding: 10px; border-radius: 5px; margin: 10px 0; font-size: 16px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #2d3748; margin: 10% auto; padding: 20px; width: 500px; border-radius: 10px; }
        .actions-column { display: flex; flex-direction: column; gap: 5px; }
        .actions-column .btn { margin: 2px 0; }
        .notification { padding: 10px; margin: 10px 0; border-radius: 5px; display: none; }
        .notification.success { background: #27ae60; }
        .notification.error { background: #e74c3c; }
        .hidden { display: none; }
        .export-buttons { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Generator Licencji - Boty AFK</h1>
            <p>Twórz i zarządzaj licencjami dla swoich botów</p>
        </div>

        <div class="notification" id="notification"></div>

        <div class="card">
            <h2>Utwórz Nową Licencję</h2>
            <form id="createLicenseForm">
                <div class="form-group">
                    <label>Typ licencji:</label>
                    <select id="licenseType" required>
                        <option value="14dni">14 dni</option>
                        <option value="30dni" selected>30 dni</option>
                        <option value="lifetime">Lifetime</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Imię klienta:</label>
                    <input type="text" id="customerName" placeholder="Wprowadź imię klienta" required>
                </div>
                <div class="form-group">
                    <label>Email klienta:</label>
                    <input type="email" id="customerEmail" placeholder="Wprowadź email klienta" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Utwórz Licencję</button>
            </form>
        </div>

        <div class="card">
            <div class="export-buttons">
                <button class="btn btn-info" onclick="exportLicenses()">Eksportuj Licencje</button>
                <button class="btn btn-warning" onclick="importLicenses()">Importuj Licencje</button>
                <input type="file" id="importFile" accept=".json" style="display: none;">
            </div>

            <h2>Lista Licencji</h2>
            <div id="loading">Ładowanie licencji...</div>
            <table id="licensesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Klucz Licencji</th>
                        <th>Typ</th>
                        <th>Klient</th>
                        <th>Status</th>
                        <th>Data Utworzenia</th>
                        <th>Ważna do</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="licensesTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal do dezaktywacji -->
    <div id="deactivateModal" class="modal">
        <div class="modal-content">
            <h3>Dezaktywuj Licencję</h3>
            <p>Podaj powód dezaktywacji:</p>
            <input type="text" id="deactivationReason" placeholder="np. Klient nie zapłacił...">
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-warning" onclick="closeModal()">Anuluj</button>
                <button class="btn btn-danger" onclick="confirmDeactivate()">Dezaktywuj</button>
            </div>
        </div>
    </div>

    <script>
        // Klucz do localStorage
        const STORAGE_KEY = 'license_system_data';
        let currentLicenseKey = null;
        let licenses = [];

        // Funkcje do zarządzania danymi w localStorage
        function loadLicensesFromStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    licenses = JSON.parse(stored);
                }
                return licenses;
            } catch (error) {
                console.error('Błąd wczytywania z localStorage:', error);
                return [];
            }
        }

        function saveLicensesToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(licenses));
                return true;
            } catch (error) {
                console.error('Błąd zapisywania do localStorage:', error);
                return false;
            }
        }

        // Funkcja do generowania klucza licencji
        function generateLicenseKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 16; i++) {
                if (i > 0 && i % 4 === 0) result += '-';
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Funkcja do obliczania daty wygaśnięcia
        function calculateExpirationDate(createdDate, days) {
            if (days === 9999) return 'NIEKOŃCZĄCA';
            
            const date = new Date(createdDate);
            date.setDate(date.getDate() + days);
            return date.toLocaleDateString('pl-PL');
        }

        // Funkcja do wyświetlania powiadomień
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }

        // Ładowanie i wyświetlanie licencji
        function loadLicenses() {
            licenses = loadLicensesFromStorage();
            
            document.getElementById('loading').style.display = 'none';
            const table = document.getElementById('licensesTable');
            table.style.display = licenses.length > 0 ? 'table' : 'none';
            
            const tbody = document.getElementById('licensesTableBody');
            tbody.innerHTML = '';
            
            if (licenses.length === 0) {
                document.getElementById('loading').innerHTML = 'Brak licencji. Utwórz pierwszą licencję!';
                return;
            }
            
            licenses.forEach(license => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong class="license-key">${license.license_key}</strong></td>
                    <td>${license.type} (${license.days === 9999 ? 'Lifetime' : license.days + ' dni'})</td>
                    <td>${license.customer_name}<br><small>${license.customer_email}</small></td>
                    <td class="${license.active ? 'status-active' : 'status-inactive'}">
                        ${license.active ? 'AKTYWNA' : 'DEZAKTYWOWANA'}
                        ${license.deactivation_reason ? `<br><small>Powód: ${license.deactivation_reason}</small>` : ''}
                    </td>
                    <td>${new Date(license.created_at).toLocaleDateString('pl-PL')}</td>
                    <td>${calculateExpirationDate(license.created_at, license.days)}</td>
                    <td>
                        <div class="actions-column">
                            <button class="btn btn-info" onclick="copyLicenseKey('${license.license_key}')">Skopiuj</button>
                            ${license.active ? 
                                `<button class="btn btn-warning" onclick="openDeactivateModal('${license.license_key}')">Dezaktywuj</button>` :
                                `<button class="btn btn-success" onclick="activateLicense('${license.license_key}')">Aktywuj</button>`
                            }
                            <button class="btn btn-danger" onclick="deleteLicense('${license.license_key}')">Usuń</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Kopiowanie klucza licencji
        function copyLicenseKey(licenseKey) {
            navigator.clipboard.writeText(licenseKey)
                .then(() => {
                    showNotification('Klucz licencji skopiowany do schowka', 'success');
                })
                .catch(err => {
                    console.error('Błąd kopiowania: ', err);
                    showNotification('Błąd kopiowania klucza', 'error');
                });
        }

        // Tworzenie nowej licencji
        document.getElementById('createLicenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('licenseType').value;
            const customerName = document.getElementById('customerName').value;
            const customerEmail = document.getElementById('customerEmail').value;
            
            // Mapowanie typu na dni
            const daysMap = {
                '14dni': 14,
                '30dni': 30,
                'lifetime': 9999
            };
            
            if (!type || !customerName || !customerEmail) {
                showNotification('Wszystkie pola są wymagane', 'error');
                return;
            }
            
            const newLicense = {
                license_key: generateLicenseKey(),
                type: type,
                days: daysMap[type],
                customer_name: customerName,
                customer_email: customerEmail,
                active: true,
                created_at: new Date().toISOString(),
                activated_at: null,
                last_check: null,
                deactivation_reason: null
            };
            
            licenses.push(newLicense);
            
            if (saveLicensesToStorage()) {
                showNotification(`Nowa licencja utworzona: ${newLicense.license_key}`, 'success');
                document.getElementById('createLicenseForm').reset();
                loadLicenses();
            } else {
                showNotification('Błąd zapisywania licencji', 'error');
            }
        });

        // Dezaktywacja licencji
        function openDeactivateModal(licenseKey) {
            currentLicenseKey = licenseKey;
            document.getElementById('deactivateModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('deactivateModal').style.display = 'none';
            currentLicenseKey = null;
            document.getElementById('deactivationReason').value = '';
        }

        function confirmDeactivate() {
            const reason = document.getElementById('deactivationReason').value;
            
            if (!reason) {
                showNotification('Proszę podać powód dezaktywacji', 'error');
                return;
            }
            
            const license = licenses.find(l => l.license_key === currentLicenseKey);
            if (license) {
                license.active = false;
                license.deactivation_reason = reason;
                
                if (saveLicensesToStorage()) {
                    showNotification('Licencja dezaktywowana', 'success');
                    closeModal();
                    loadLicenses();
                } else {
                    showNotification('Błąd zapisywania', 'error');
                }
            }
        }

        // Aktywacja licencji
        function activateLicense(licenseKey) {
            if (!confirm('Czy na pewno chcesz aktywować tę licencję?')) return;
            
            const license = licenses.find(l => l.license_key === licenseKey);
            if (license) {
                license.active = true;
                license.deactivation_reason = null;
                license.activated_at = new Date().toISOString();
                
                if (saveLicensesToStorage()) {
                    showNotification('Licencja aktywowana', 'success');
                    loadLicenses();
                } else {
                    showNotification('Błąd zapisywania', 'error');
                }
            }
        }

        // Usuwanie licencji
        function deleteLicense(licenseKey) {
            if (!confirm('CZY NA PEWNO CHCESZ USUNĄĆ TĘ LICENCJĘ?\n\nTej operacji nie można cofnąć!')) return;
            
            licenses = licenses.filter(l => l.license_key !== licenseKey);
            
            if (saveLicensesToStorage()) {
                showNotification('Licencja usunięta', 'success');
                loadLicenses();
            } else {
                showNotification('Błąd usuwania', 'error');
            }
        }

        // Eksport licencji
        function exportLicenses() {
            const dataStr = JSON.stringify(licenses, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(dataBlob);
            link.download = `licencje_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            
            showNotification('Licencje wyeksportowane', 'success');
        }

        // Import licencji
        function importLicenses() {
            document.getElementById('importFile').click();
        }

        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedLicenses = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedLicenses)) {
                        throw new Error('Nieprawidłowy format pliku');
                    }
                    
                    // Sprawdź czy mają wymagane pola
                    const requiredFields = ['license_key', 'type', 'days', 'customer_name'];
                    const isValid = importedLicenses.every(license => 
                        requiredFields.every(field => license.hasOwnProperty(field))
                    );
                    
                    if (!isValid) {
                        throw new Error('Plik nie zawiera wymaganych pól licencji');
                    }
                    
                    if (confirm(`Zaimportować ${importedLicenses.length} licencji?`)) {
                        licenses = importedLicenses;
                        if (saveLicensesToStorage()) {
                            showNotification(`Zaimportowano ${importedLicenses.length} licencji`, 'success');
                            loadLicenses();
                        }
                    }
                } catch (error) {
                    showNotification('Błąd importu: ' + error.message, 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset input
        });

        // Inicjalizacja
        document.addEventListener('DOMContentLoaded', loadLicenses);
    </script>
</body>
</html>
